<meta charset="utf-8">

<style>
/* VK Saham: adik VK Signal untuk Bursa Malaysia. Hitam & emas, satu lajur, tab bar di bawah. */
:root{
  --bg:#0A0907; --surface:#14120E; --surface-2:#1C1914; --line:#2F2A20; --line-soft:#23201A;
  --fg:#F3EEE3; --muted:#A39A86; --accent:#D9AC45; --accent-soft:rgba(217,172,69,.14); --accent-ink:#120E05;
  --gold-hi:#F4D77E; --gold-lo:#A97A1C;
  --buy:#1FC48D; --buy-soft:rgba(31,196,141,.14); --sell:#FF5A6A; --sell-soft:rgba(255,90,106,.14); --warn:#E8873A; --warn-soft:rgba(232,135,58,.15);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --line:#DCD2BE; --line-soft:#E8E1D3;
  --fg:#17130C; --muted:#6B6150; --accent:#94690C; --accent-soft:rgba(148,105,12,.11); --accent-ink:#FFFFFF;
  --gold-hi:#E3BC55; --gold-lo:#8A600B;
  --buy:#0E9A6B; --buy-soft:rgba(14,154,107,.11); --sell:#D93347; --sell-soft:rgba(217,51,71,.10); --warn:#C0611A; --warn-soft:rgba(192,97,26,.12);
  --shadow:0 18px 50px rgba(60,45,15,.16); color-scheme:light;
}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wide{max-width:1040px}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand b{font-family:var(--font-display);font-size:19px;letter-spacing:.02em;font-weight:700}
.brand b span{color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px;white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.live.on{color:var(--buy)} .live.on::before{background:var(--buy)}
.live.off{color:var(--warn)} .live.off::before{background:var(--warn)}
.tape{overflow:hidden;border-top:1px solid var(--line-soft);font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.tape-in{display:inline-flex;gap:28px;padding:5px 14px;animation:tape 60s linear infinite}
.tape-in span b{font-weight:600;color:var(--muted);margin-right:6px}
@keyframes tape{to{transform:translateX(-50%)}}
@keyframes pulse{50%{opacity:.3}}
main{padding-block:20px 24px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--buy)} .neg{color:var(--sell)}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.banner{font-size:13.5px;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:10px 12px;margin:0}
.hello{text-align:center;padding:10px 0 4px}
.hello .name{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}
.hello .name span{color:var(--accent)}
.hello .clock{font-family:var(--font-mono);color:var(--muted);font-size:13px;margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip>div{background:var(--surface);padding:12px 14px;min-width:0}

.st.PEGANG{background:var(--accent-soft);color:var(--accent)}

.st.TURUN,.st.ELAK{background:var(--sell-soft);color:var(--sell)}

.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);text-decoration:none}
.chip[aria-current="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
.hero-px{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:600;line-height:1.1;color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.box{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.box .p{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.box.buy{background:var(--buy-soft)} .box.buy .p{color:var(--buy)}
.box.sell{background:var(--sell-soft)} .box.sell .p{color:var(--sell)}
.sig{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none}
.sig:hover{border-color:var(--accent)}
.sig .head{display:flex;align-items:center;gap:10px}
.sig .head .grow{flex:1;min-width:0}
.calc{font-size:13px;background:var(--surface-2);border-radius:8px;padding:9px 11px;margin:0;color:var(--fg)}
.calc b{font-family:var(--font-mono);font-weight:600}
.chart-box{position:relative;width:100%;height:240px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.chart-box canvas{width:100%;height:100%;display:block}
.cap{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.spark{width:100%;height:56px;display:block}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable th,.dtable td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
.dtable th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dtable td.num,.dtable th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dtable tr.bad td{color:var(--muted)}
.dtable tr.good td:first-child{color:var(--accent);font-weight:600}
.scroll-x{overflow-x:auto;min-width:0}
.ana ol,.ana ul,.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide p,.guide li{max-width:66ch}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-family:var(--font-mono);width:100%}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ipo{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:8px 14px;border-radius:9px;font-weight:500;text-decoration:none;color:var(--fg);display:inline-block}
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);max-width:calc(100vw - 20px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 14px;border-radius:13px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;min-width:62px}
.tabbar a svg{width:20px;height:20px}
.tabbar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
footer{color:var(--muted);font-size:12px;padding-block:8px 0;text-align:center}
@media (max-width:560px){
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{gap:6px} .three .box{padding:8px 9px} .three .box .p{font-size:14.5px}
  .tabbar a{padding:7px 8px;min-width:54px}
  .hero-px{font-size:32px}
  .chart-box{height:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const px = x => x == null || isNaN(x) ? '–' : (x < 1 ? x.toFixed(3) : x.toFixed(2));
const rm = x => x == null || isNaN(x) ? '–' : 'RM' + Math.round(x).toLocaleString('en-MY');
const rm2 = x => x == null || isNaN(x) ? '–' : 'RM' + x.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
const pc = (x, d = 1) => x == null || isNaN(x) ? '–' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const store = { get(k, d) { try { const v = localStorage.getItem('vks:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('vks:' + k, JSON.stringify(v)); } catch (e) {} } };

let D = null, S = [], BY = {}, T = [], IPO = null;
let MODAL = store.get('modal', 5000), RISK = store.get('risk', 1);
let BLUE = new Set(), DIVTOP = [], LISTCAT = 'semua', QUERY = '';

/* Ujian 10 tahun (PromptTest.java, 960 saham Bursa, kos 0.5%, 2016-2026). Hasil dibekukan 2026-11-15. */
const UJIAN = [
  {n:'VK Saham (tertinggi 52 minggu, SL 2 ATR, jual bawah EMA50)', t:3473, w:16, avg:1.77, pf:1.41, a:'+1083R', b:'+317R', ok:true},
  {n:'Prompt Swing: breakout 20 hari, RSI 50-70, SL rendah 10 hari, TP 1:2', t:5630, w:42, avg:-0.28, pf:0.93, a:'-56R', b:'-144R'},
  {n:'Prompt Swing: pullback EMA20, SL rendah 10 hari, TP 1:2', t:8309, w:34, avg:-1.10, pf:0.69, a:'-862R', b:'-929R'},
  {n:'Prompt Swing: breakout 20 hari, SL 2 ATR, TP 1:2', t:7387, w:32, avg:-0.75, pf:0.67, a:'-796R', b:'-1245R'},
  {n:'Prompt Swing: pullback EMA20, SL 2 ATR, TP 1:2', t:9575, w:31, avg:-0.98, pf:0.64, a:'-1440R', b:'-1385R'},
  {n:'Prompt Penny: volum 3x, cut loss ketat, TP 1:2', t:5659, w:29, avg:-1.79, pf:0.62, a:'-645R', b:'-1000R'}
];
const TAHUN = [['2017','+228'],['2018','-84'],['2019','+43'],['2020','+1021'],['2021','-152'],['2022','-31'],['2023','+157'],['2024','+211'],['2025','+78'],['2026','-71']];

/* Yuran Moomoo MY satu hala: 0.03% komisen + RM3 platform + 0.03% penjelasan (maks RM1,000) + SST 8% atas yuran + duti setem RM1 setiap RM1,000 */
function yuran(nilai) {
  if (!(nilai > 0)) return 0;
  const kom = nilai * 0.0003, plat = 3, clr = Math.min(nilai * 0.0003, 1000);
  return kom + plat + clr + (kom + plat + clr) * 0.08 + Math.min(Math.ceil(nilai / 1000), 1000);
}
/* Saiz kedudukan: risiko % modal dibahagi jarak SL, dibundarkan ke lot 100 unit, tidak melebihi modal */
function saiz(entry, sl) {
  const R = entry - sl; if (!(R > 0) || !(entry > 0)) return null;
  const byRisk = Math.floor(MODAL * RISK / 100 / R / 100) * 100, byCap = Math.floor(MODAL / entry / 100) * 100;
  const u = Math.max(0, Math.min(byRisk, byCap)), nilai = u * entry;
  return { u, lot: u / 100, nilai, rugi: u * R + yuran(nilai) + yuran(u * sl), yur: yuran(nilai) + yuran(nilai), byRisk, byCap };
}
function calcHtml(entry, sl) {
  const z = saiz(entry, sl);
  if (!z) return '';
  if (z.u === 0) {
    const min = 100 * entry;
    return `<p class="calc">Modal ${rm(MODAL)} dengan risiko ${RISK}% tak cukup untuk 1 lot (100 unit = ${rm2(min)}, risiko ${rm2(100 * (entry - sl))}). Lebih baik lepaskan signal ini.</p>`;
  }
  return `<p class="calc">Modal ${rm(MODAL)}, risiko ${RISK}%: beli <b>${z.lot} lot</b> (${z.u.toLocaleString('en-MY')} unit) ≈ <b>${rm2(z.nilai)}</b>. Kalau kena SL, rugi lebih kurang <b class="neg">${rm2(z.rugi)}</b> termasuk yuran.${z.byCap < z.byRisk ? ' (Dihadkan oleh modal.)' : ''}</p>`;
}

function trendUp(s) { return s.e50 > s.e200 && s.c > s.e200; }
/* Status yang dipapar ikut trade strategi: BELI hanya bila ada signal baru yang sah, PEGANG bila strategi sedang pegang */
function stName(s) {
  const ot = T.find(t => t.k === s.k && (t.status === 'PEGANG' || t.status === 'BARU'));
  if (ot) return ot.status === 'BARU' ? 'BELI' : 'PEGANG';
  return s.st === 'TURUN' ? 'ELAK' : s.st === 'BELI' ? 'NAIK' : s.st;
}
function chg(s) { return s.semalam ? s.c / s.semalam - 1 : 0; }
function short(n) { return String(n).replace(/ (Holdings|Group|Berhad|Bhd|Corporation|Industries|International|Resources)\b.*$/i, '') || n; }

function prepare() {
  S = D.saham || []; BY = {}; S.forEach(s => BY[s.k] = s);
  T = (D.trades || []).slice().sort((a, b) => b.sig < a.sig ? -1 : b.sig > a.sig ? 1 : 0);
  BLUE = new Set(S.filter(s => s.mc > 0).sort((a, b) => b.mc - a.mc).slice(0, 30).map(s => s.k));
  // Pelaburan "Dividen + Stabil": susun dividen 12 bulan / harga (tinggi) + volatiliti 252 hari (rendah)
  const c = S.filter(s => s.dy > 0 && s.vol > 0);
  const byDy = c.slice().sort((a, b) => b.dy - a.dy), byVol = c.slice().sort((a, b) => a.vol - b.vol);

  DIVTOP = c.sort((a, b) => rank[a.k] - rank[b.k]).slice(0, 10);
}

/* ---------- satu saham: analisis format prompt ---------- */
function analisa(s) {
  const ot = openTrade(s.k), up = trendUp(s), toHigh = s.c / s.hh - 1, cats = [];
  if (ot || s.st === 'HAMPIR') cats.push('Swing Trade');
  if (DIVTOP.some(d => d.k === s.k)) cats.push('Pelaburan (Dividen + Stabil)');
  if (BLUE.has(s.k)) cats.push('Blue Chip');
  if (isPenny(s)) cats.push('Penny berkualiti (pantau)');
  const kuat = [], risiko = [];
  if (up) kuat.push(`Trend naik: harga ${px(s.c)} atas EMA200 (${px(s.e200)}) dan EMA50 atas EMA200.`);
  if (up && toHigh >= -0.03) kuat.push(`Dekat paras tertinggi 52 minggu (${px(s.hh)}, ${pc(toHigh)}): breakout = isyarat BELI.`);
  if (s.dy >= 4) kuat.push(`Dividen 12 bulan ${s.dy.toFixed(1)}% setahun.`);
  if (s.vol > 0 && s.vol <= 25) kuat.push(`Harga stabil: bergerak ±${s.vol.toFixed(0)}% setahun.`);
  if (s.mc >= 10e9) kuat.push(`Syarikat besar: modal pasaran ${rm(s.mc / 1e9)} bilion.`);
  if (s.eps > 0) kuat.push(`Syarikat untung (EPS RM${s.eps}).`);
  kuat.push(`Mudah beli/jual: purata ${rm(s.nilai / 1e6)} juta didagang sehari.`);
  if (!up) risiko.push(`Trend turun: harga bawah EMA200 (${px(s.e200)}) atau EMA50 bawah EMA200. Strategi tidak beli.`);
  if (D.klci && !D.klci.naik) risiko.push('KLCI bawah EMA200: pasaran umum lemah, lebih banyak breakout gagal.');
  if (s.eps != null && s.eps <= 0) risiko.push(`Syarikat rugi (EPS RM${s.eps}).`);
  if (s.vol > 40) risiko.push(`Harga sangat liar: bergerak ±${s.vol.toFixed(0)}% setahun.`);
  if (s.c < 1) risiko.push(`Saham penny: 1 sen = ${(0.01 / s.c * 100).toFixed(1)}% pergerakan.`);
  if (up && s.c / s.e50 - 1 > 0.15) risiko.push(`Harga ${pc(s.c / s.e50 - 1)} atas EMA50: kalau jatuh ke EMA50, untung banyak hilang.`);
  if (s.dy < 1) risiko.push('Dividen kecil atau tiada.');
  risiko.push('Strategi ini menang lebih kurang 1 daripada 6 trade (ujian 10 tahun); kebanyakan trade rugi kecil.');
  let plan;
  if (ot && ot.status === 'BARU') plan = `<li><b>Zon belian:</b> harga buka esok, hanya jika ≤ ${px(ot.buyMax)}.</li><li><b>Stop Loss:</b> ${px(ot.sl)} (2 × ATR).</li><li><b>Sasaran:</b> tiada TP tetap. Jual bila harga tutup bawah EMA50 (sekarang ${px(s.e50)}). Dalam ujian, trade yang menang purata naik jauh lebih besar daripada 1:2.</li>`;
  else if (ot) plan = `<li><b>Sudah dibeli</b> ${esc(ot.masuk)} pada ${px(ot.entry)} (sekarang ${pc(ot.harga / ot.entry - 1)}).</li><li><b>Stop Loss:</b> ${px(ot.sl)}.</li><li><b>Jual:</b> bila tutup bawah EMA50 (sekarang ${px(s.e50)}).</li>`;
  else if (up) plan = `<li><b>Zon belian:</b> tunggu harga TUTUP atas ${px(s.hh)} (paras tertinggi 52 minggu). Kemudian beli harga buka esok.</li><li><b>Stop Loss anggaran:</b> ${px(s.hh - 2 * s.atr)} (paras itu − 2 × ATR ${px(s.atr)}).</li><li><b>Sasaran:</b> tiada TP tetap; jual bila tutup bawah EMA50.</li>`;
  else plan = `<li><b>Swing: ELAK.</b> Tunggu trend naik semula (harga atas EMA200 ${px(s.e200)}).</li>`;
  if (DIVTOP.some(d => d.k === s.k)) plan += `<li><b>Pelaburan:</b> dalam senarai Dividen + Stabil. Beli sekali setahun, pegang 12 bulan, tiada SL (diuji: ≈ +8.4% setahun termasuk dividen).</li>`;
  return { cats, kuat: kuat.slice(0, 3), risiko: risiko.slice(0, 2), plan };
}

function drawChart(s, ot) {
  const cv = $('#cv'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const c = s.cl, lv = [s.hh, s.e50].concat(ot ? [ot.sl] : []);
  let lo = Math.min(...c, ...lv), hi = Math.max(...c, ...lv); const pad = (hi - lo) * 0.08 || 0.01; lo -= pad; hi += pad;
  const W = r.width, H = r.height, X = i => 8 + i * (W - 60) / (c.length - 1), Y = v => 8 + (hi - v) * (H - 16) / (hi - lo);
  const line = (v, color, dash) => { g.strokeStyle = color; g.setLineDash(dash ? [5, 4] : []); g.lineWidth = 1.2; g.beginPath(); g.moveTo(8, Y(v)); g.lineTo(W - 52, Y(v)); g.stroke(); g.setLineDash([]);
    g.fillStyle = color; g.font = '11px JetBrains Mono, monospace'; g.fillText(px(v), W - 48, Y(v) + 4); };
  line(s.hh, col('--accent'), true); line(s.e50, '#5B9BF0', true); if (ot) line(ot.sl, col('--sell'), true);
  g.strokeStyle = col('--fg'); g.lineWidth = 1.8; g.beginPath();
  c.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
}

function spark(c, ref) {
  const w = 300, h = 56, lo = Math.min(...c, ref), hi = Math.max(...c, ref), y = v => (h - 4 - (v - lo) / (hi - lo || 1) * (h - 8)).toFixed(1);
  const pts = c.map((v, i) => (i * w / (c.length - 1)).toFixed(1) + ',' + y(v)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--muted)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function statBlock(L) {
  const done = L.filter(t => t.status === 'SELESAI'), win = done.filter(t => t.ret > 0);
  const sum = done.reduce((a, t) => a + t.ret, 0), best = done.reduce((a, t) => Math.max(a, t.ret), -1), worst = done.reduce((a, t) => Math.min(a, t.ret), 1);
  return { n: done.length, open: L.filter(t => t.status === 'PEGANG').length, win: done.length ? win.length / done.length : 0, avg: done.length ? sum / done.length : 0, sum, best, worst };
}

    <div class="panel"><h2>Ujian 10 tahun: VK vs prompt</h2>

      ${UJIAN.map(u => `<tr class="${u.ok ? 'good' : 'bad'}"><td style="white-space:normal;min-width:220px">${esc(u.n)}</td><td class="num">${u.t}</td><td class="num">${u.w}%</td><td class="num ${cls(u.avg)}">${u.avg > 0 ? '+' : ''}${u.avg.toFixed(2)}%</td><td class="num">${u.pf.toFixed(2)}</td><td class="num">${u.a}</td><td class="num">${u.b}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">PF = jumlah untung ÷ jumlah rugi. Bawah 1 = rugi. Hanya peraturan VK lulus. Tapi jujur: hampir 3/4 untungnya datang dari tahun 2020 (lantunan selepas COVID). Tanpa 2020: +379R dalam 9 tahun.</p>

/* ---------- router ---------- */
function route() {
  if (!D) return;
  const h = (location.hash || '#home').slice(1);
  const v = h.startsWith('s-') ? 'stock' : (['home', 'signals', 'list', 'stats', 'guide'].includes(h) ? h : 'home');
  document.querySelectorAll('main > section').forEach(sec => sec.hidden = sec.dataset.view !== v);
  document.querySelectorAll('.tabbar a').forEach(a => { if (a.dataset.v === (v === 'stock' ? 'list' : v)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  ({home: renderHome, signals: renderSignals, list: renderList, stats: renderStats, guide: renderGuide})[v]?.() ?? renderStock(h.slice(2));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { const h = location.hash; if (h.startsWith('#s-')) { const s = BY[h.slice(3)]; if (s) drawChart(s, openTrade(s.k)); } });

function tape() {
  const k = D.klci, items = [];
  if (k) items.push(`<span><b>KLCI</b>${px(k.tutup)} <span class="${cls(k.tutup - k.semalam)}">${pc(k.tutup / k.semalam - 1, 2)}</span></span>`);
  S.filter(s => BLUE.has(s.k)).slice(0, 20).forEach(s => items.push(`<span><b>${esc(short(s.n))}</b>${px(s.c)} <span class="${cls(chg(s))}">${pc(chg(s), 2)}</span></span>`));
  $('#tape').innerHTML = items.join('') + items.join('');
}

async function load() {
  try {
    const r = await fetch('vk-saham.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json(); prepare(); tape();
    const age = (Date.now() - new Date(D.tarikhData + 'T17:00:00+08:00')) / 864e5;
    const lv = $('#live'); lv.textContent = 'Data ' + D.tarikhData; lv.className = 'live ' + (age < 4 ? 'on' : 'off');
  } catch (e) {
    $('#v-home').innerHTML = `<div class="empty"><b>Data tak dapat dimuatkan</b>${esc(e.message)}. Cuba muat semula.</div>`;
    $('#live').textContent = 'Luar talian'; $('#live').className = 'live off'; return;
  }
  try { const r = await fetch('ipo.json', {cache: 'no-store'}); if (r.ok) IPO = await r.json(); } catch (e) {}
  route();
}
load();

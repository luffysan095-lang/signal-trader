name: Noti signal crypto forex

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      uji:
        description: 'Hantar mesej ujian ke Telegram'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  semak:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Semak signal
        shell: powershell
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UJI: ${{ inputs.uji }}
        run: ./noti-isyarat.ps1
      - name: Simpan rekod noti dan signal VK
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noti-state.json
          [ -f vk-signals.json ] && git add vk-signals.json
          git diff --cached --quiet && exit 0
          git commit -m "Rekod noti dan signal VK"
          git pull --rebase && git push || (sleep 20 && git pull --rebase && git push)

  # Terbit semula laman supaya VK Signal nampak data terkini
  terbit:
    needs: semak
    if: ${{ always() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

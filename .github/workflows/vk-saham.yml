name: VK Saham signal harian

on:
  schedule:
    # Isnin-Jumaat 6:50 petang MYT (Bursa dan SGX tutup 5 petang), dan sekali lagi 9:15 malam jika Yahoo lewat.
    # US: sesi New York semalam sudah tutup (4/5 pagi MYT), jadi signal US sedia sebelum pasaran US buka 9:30/10:30 malam MYT.
    - cron: '50 10 * * 1-5'
    - cron: '15 13 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'vk-saham.html'
      - 'vk-saham.ps1'
      - 'senarai-vk-saham.txt'
      - 'senarai-vk-saham-sg.txt'
      - 'senarai-vk-saham-us.txt'
      - 'ipo.json'
      - '.github/workflows/vk-saham.yml'
  workflow_dispatch:

jobs:
  kira:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: vk-saham-kira
      cancel-in-progress: false
    steps:
      # Sentiasa mula dari main terkini (bukan commit pencetus), supaya larian berturut-turut tidak bertembung
      - uses: actions/checkout@v4
        with:
          ref: main
      # Setiap pasaran berasingan: jika satu gagal, fail lamanya dikekalkan dan pasaran lain tetap dikemas kini
      - name: Kira signal Bursa
        continue-on-error: true
        shell: powershell
        run: ./vk-saham.ps1 -Pasaran MY
      - name: Kira signal SGX (ujian)
        continue-on-error: true
        shell: powershell
        run: ./vk-saham.ps1 -Pasaran SG
      - name: Kira signal US saham besar (ujian)
        continue-on-error: true
        shell: powershell
        run: ./vk-saham.ps1 -Pasaran US
      - name: Simpan signal
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in vk-saham.json vk-saham-noti.json vk-saham-sg.json vk-saham-sg-noti.json vk-saham-us.json vk-saham-us-noti.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Signal VK Saham terkini"
          # Jika larian lain sempat menyimpan fail yang sama, data larian ini (lebih baru) diutamakan
          git pull --rebase -X theirs && git push || (sleep 20 && git pull --rebase -X theirs && git push)

  terbit:
    needs: kira
    if: ${{ always() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

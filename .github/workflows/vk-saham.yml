name: VK Saham signal harian

on:
  schedule:
    # Isnin-Jumaat 6:50 petang MYT (pasaran Bursa tutup 5 petang), dan sekali lagi 9:15 malam jika Yahoo lewat
    - cron: '50 10 * * 1-5'
    - cron: '15 13 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'vk-saham.html'
      - 'vk-saham.ps1'
      - 'senarai-vk-saham.txt'
      - 'ipo.json'
      - '.github/workflows/vk-saham.yml'
  workflow_dispatch:

jobs:
  kira:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: vk-saham-kira
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Kira signal saham
        shell: powershell
        run: ./vk-saham.ps1
      - name: Simpan signal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-saham.json
          git diff --cached --quiet && exit 0
          git commit -m "Signal VK Saham terkini"
          git pull --rebase && git push || (sleep 20 && git pull --rebase && git push)

  terbit:
    needs: kira
    if: ${{ always() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
